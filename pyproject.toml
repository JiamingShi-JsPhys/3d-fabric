[project]
name = "3d-fabric"
version = "1.1.1"
description = "The complete 3D toolchain in one plugin: printable CAD by natural language through the local SolidCraft CLI (build, edit, measure, preview, inspect, repair), plus thirty Blender skills for organic modelling, materials, lighting, cameras, rendering and animation."
authors = [{ name = "Jiaming Shi" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "trimesh>=4,<6",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=2.8",
    "lxml>=4.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "numpy-stl>=3.0",
]

[tool.pyright]
extraPaths = ["."]
include = ["run.py", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
